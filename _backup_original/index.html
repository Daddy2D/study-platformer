<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мини-платформер</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas {
      border: 4px solid #000;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <!-- Настройки -->
  <script src="settings.js"></script>

  <!-- Файлы уровней -->
  <script src="levels/level1.js"></script>
  <script src="levels/level2.js"></script>
  <script src="levels/level3.js"></script>
  <script src="levels/level4.js"></script>
  <script src="levels/level5.js"></script>

  <script>
    // ============================================
    // СПРАЙТЫ
    // ============================================
    const SPRITES = {
      sky: "sprites/sky.png",
      cloud: "sprites/cloud.png",
      player: "sprites/player.png",
      ground: "sprites/ground.png",
      coin: "sprites/coin.png",
      enemy: "sprites/enemy.png",
      spike: "sprites/spike.png",
      checkpoint: "sprites/checkpoint.png",
      moving: "sprites/moving.png",
      key: "sprites/key.png",
      door: "sprites/door.png",
      bullet: "sprites/bullet.png"
    };

    const LEVELS = [
      LEVEL_1,
      LEVEL_2,
      LEVEL_3,
      LEVEL_4,
      LEVEL_5
    ];

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const keys = {};
    let jumpPressed = false;

    function isJumpKey(code) {
      return code === "Space" || code === "ArrowUp" || code === "KeyW";
    }

    window.addEventListener("keydown", e => {
      if ([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Space"
      ].includes(e.code)) {
        e.preventDefault();
      }

      keys[e.code] = true;

      if (!e.repeat && isJumpKey(e.code)) {
        jumpPressed = true;
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    const IMAGES = {};

    for (const [name, src] of Object.entries(SPRITES)) {
      const img = new Image();
      img.src = src;
      IMAGES[name] = img;
    }

    // ============================================
    // ПЕРЕМЕННЫЕ УРОВНЯ
    // ============================================
    let solids = [];
    let spikes = [];
    let checkpoints = [];
    let movingPlatforms = [];

    let coins = [];
    let enemies = [];
    let keyItems = [];
    let doors = [];
    let bullets = [];

    let keyCount = 0;

    let playerStart = { x: 100, y: 100 };
    let currentCheckpoint = { x: 100, y: 100 };

    let score = 0;
    let currentLevelIndex = 0;

    let levelWidth = 1;
    let levelHeight = 1;

    let levelComplete = false;
    let levelCompleteTimer = 0;

    let gameFinished = false;

    const player = {
      x: 100,
      y: 100,
      w: SETTINGS.playerWidth,
      h: SETTINGS.playerHeight,
      vx: 0,
      vy: 0,
      onGround: false,
      jumpsLeft: SETTINGS.maxJumps,
      standingPlatform: null
    };

    // Облака для параллакса
    const clouds = [];

    for (let i = 0; i < SETTINGS.cloudCount; i++) {
      clouds.push({
        x: Math.random() * (canvas.width + 600),
        y: 20 + Math.random() * 220,
        scale: 0.5 + Math.random() * 1.3,
        factor: 0.1 + Math.random() * 0.4
      });
    }

    function intersects(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function solidAt(x, y) {
      for (const s of solids) {
        if (
          x >= s.x &&
          x < s.x + s.w &&
          y >= s.y &&
          y < s.y + s.h
        ) {
          return true;
        }
      }

      for (const door of doors) {
        if (
          !door.open &&
          x >= door.x &&
          x < door.x + door.w &&
          y >= door.y &&
          y < door.y + door.h
        ) {
          return true;
        }
      }

      return false;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function forSolidRects(callback) {
      for (const s of solids) {
        callback(s);
      }

      for (const door of doors) {
        if (!door.open) {
          callback(door);
        }
      }
    }

    function resetPlayer() {
      player.x = currentCheckpoint.x;
      player.y = currentCheckpoint.y;
      player.vx = 0;
      player.vy = 0;
      player.jumpsLeft = SETTINGS.maxJumps;
      player.standingPlatform = null;
      jumpPressed = false;

      bullets.length = 0;
    }

    function createMovingPlatform(px, py, axis) {
      return {
        x: px,
        y: py,
        w: SETTINGS.movingPlatformWidth,
        h: SETTINGS.movingPlatformHeight,
        startX: px,
        startY: py,
        axis: axis,
        dir: 1,
        speed: axis === "x"
          ? SETTINGS.movingPlatformHorizontalSpeed
          : SETTINGS.movingPlatformVerticalSpeed,
        range: axis === "x"
          ? SETTINGS.movingPlatformHorizontalRange
          : SETTINGS.movingPlatformVerticalRange,
        dx: 0,
        dy: 0
      };
    }

    // ============================================
    // ЗАГРУЗКА УРОВНЯ
    // ============================================
    function loadLevel(index) {
      currentLevelIndex = index;

      const level = LEVELS[index];

      solids.length = 0;
      spikes.length = 0;
      checkpoints.length = 0;
      movingPlatforms.length = 0;

      coins.length = 0;
      enemies.length = 0;
      keyItems.length = 0;
      doors.length = 0;
      bullets.length = 0;

      keyCount = 0;

      levelComplete = false;
      levelCompleteTimer = 0;
      gameFinished = false;

      playerStart = { x: 100, y: 100 };

      level.forEach((row, y) => {
        [...row].forEach((char, x) => {
          const px = x * TILE;
          const py = y * TILE;

          if (char === "G") {
            solids.push({
              x: px,
              y: py,
              w: TILE,
              h: TILE
            });
          }

          if (char === "P") {
            playerStart = {
              x: px + SETTINGS.respawnOffsetX,
              y: py + TILE - SETTINGS.playerHeight
            };
          }

          if (char === "C") {
            coins.push({
              x: px + SETTINGS.coinOffset,
              y: py + SETTINGS.coinOffset,
              w: SETTINGS.coinWidth,
              h: SETTINGS.coinHeight,
              taken: false
            });
          }

          if (char === "E") {
            enemies.push({
              x: px + 4,
              y: py + TILE - SETTINGS.enemyHeight,
              w: SETTINGS.enemyWidth,
              h: SETTINGS.enemyHeight,
              vx: 0,
              vy: 0,
              dir: 1,
              speed: SETTINGS.enemySpeed,
              onGround: false,
              dead: false,
              shooter: false
            });
          }

          if (char === "T") {
            enemies.push({
              x: px + 4,
              y: py + TILE - SETTINGS.enemyHeight,
              w: SETTINGS.enemyWidth,
              h: SETTINGS.enemyHeight,
              vx: 0,
              vy: 0,
              dir: 1,
              speed: 0,
              onGround: false,
              dead: false,
              shooter: true,
              shootCooldown: SETTINGS.shooterStartCooldown
            });
          }

          if (char === "S") {
            spikes.push({
              x: px,
              y: py,
              w: TILE,
              h: TILE
            });
          }

          if (char === "F") {
            checkpoints.push({
              x: px,
              y: py,
              w: TILE,
              h: TILE,
              active: false,
              spawnX: px + SETTINGS.respawnOffsetX,
              spawnY: py + TILE - SETTINGS.playerHeight
            });
          }

          if (char === "M") {
            movingPlatforms.push(createMovingPlatform(px, py, "x"));
          }

          if (char === "V") {
            movingPlatforms.push(createMovingPlatform(px, py, "y"));
          }

          if (char === "K") {
            keyItems.push({
              x: px + SETTINGS.keyOffset,
              y: py + SETTINGS.keyOffset,
              w: SETTINGS.keyWidth,
              h: SETTINGS.keyHeight,
              taken: false
            });
          }

          if (char === "D") {
            doors.push({
              x: px,
              y: py,
              w: TILE,
              h: TILE,
              open: false
            });
          }
        });
      });

      levelWidth = Math.max(...level.map(row => row.length)) * TILE;
      levelHeight = level.length * TILE;

      player.x = playerStart.x;
      player.y = playerStart.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.jumpsLeft = SETTINGS.maxJumps;
      player.standingPlatform = null;

      currentCheckpoint = {
        x: playerStart.x,
        y: playerStart.y
      };

      jumpPressed = false;
    }

    // ============================================
    // ОБНОВЛЕНИЕ
    // ============================================
    function updateMovingPlatforms() {
      for (const p of movingPlatforms) {
        const oldX = p.x;
        const oldY = p.y;

        if (p.axis === "x") {
          p.x += p.dir * p.speed;

          if (p.x > p.startX + p.range || p.x < p.startX - p.range) {
            p.dir *= -1;
            p.x = clamp(p.x, p.startX - p.range, p.startX + p.range);
          }
        } else {
          p.y += p.dir * p.speed;

          if (p.y > p.startY + p.range || p.y < p.startY - p.range) {
            p.dir *= -1;
            p.y = clamp(p.y, p.startY - p.range, p.startY + p.range);
          }
        }

        p.dx = p.x - oldX;
        p.dy = p.y - oldY;
      }
    }

    function updatePlayer() {
      if (player.standingPlatform) {
        const p = player.standingPlatform;

        const stillOn =
          player.x + player.w > p.x &&
          player.x < p.x + p.w &&
          Math.abs((player.y + player.h) - p.y) < 18;

        if (stillOn) {
          player.x += p.dx;
          player.y += p.dy;
        } else {
          player.standingPlatform = null;
        }
      }

      let input = 0;

      if (keys.ArrowLeft || keys.KeyA) input -= 1;
      if (keys.ArrowRight || keys.KeyD) input += 1;

      player.vx += input * SETTINGS.playerAccel;
      player.vx *= SETTINGS.playerFriction;
      player.vx = clamp(
        player.vx,
        -SETTINGS.playerMaxSpeed,
        SETTINGS.playerMaxSpeed
      );

      const wasOnGround = player.onGround;

      if (player.onGround) {
        player.jumpsLeft = SETTINGS.maxJumps;
      }

      if (jumpPressed) {
        if (player.jumpsLeft > 0) {
          player.vy = SETTINGS.jumpForce;
          player.jumpsLeft -= 1;
        }

        jumpPressed = false;
      }

      player.vy += SETTINGS.gravity;

      const moveX = player.vx;
      player.x += player.vx;

      forSolidRects(s => {
        if (intersects(player, s)) {
          if (moveX > 0) {
            player.x = s.x - player.w;
          } else if (moveX < 0) {
            player.x = s.x + s.w;
          } else {
            if (player.x + player.w / 2 < s.x + s.w / 2) {
              player.x = s.x - player.w;
            } else {
              player.x = s.x + s.w;
            }
          }

          player.vx = 0;
        }
      });

      const oldBottom = player.y + player.h;
      const moveY = player.vy;

      player.y += player.vy;
      player.onGround = false;
      player.standingPlatform = null;

      forSolidRects(s => {
        if (intersects(player, s)) {
          if (moveY > 0) {
            player.y = s.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (moveY < 0) {
            player.y = s.y + s.h;
            player.vy = 0;
          }
        }
      });

      if (player.vy >= 0) {
        for (const p of movingPlatforms) {
          const horizontallyOverlaps =
            player.x + player.w > p.x &&
            player.x < p.x + p.w;

          const landedOnTop =
            oldBottom <= p.y + 18 &&
            player.y + player.h >= p.y;

          if (horizontallyOverlaps && landedOnTop) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.standingPlatform = p;
          }
        }
      }

      if (player.onGround) {
        player.jumpsLeft = SETTINGS.maxJumps;
      } else if (wasOnGround && player.vy >= 0) {
        player.jumpsLeft = 1;
      }

      if (player.y > levelHeight + 300) {
        resetPlayer();
      }
    }

    function updateCheckpoints() {
      for (const checkpoint of checkpoints) {
        if (intersects(player, checkpoint)) {
          if (!checkpoint.active) {
            for (const other of checkpoints) {
              other.active = false;
            }

            checkpoint.active = true;

            currentCheckpoint = {
              x: checkpoint.spawnX,
              y: checkpoint.spawnY
            };
          }
        }
      }
    }

    function updateKeys() {
      for (const key of keyItems) {
        if (!key.taken && intersects(player, key)) {
          key.taken = true;
          keyCount += 1;
        }
      }

      keyItems = keyItems.filter(key => !key.taken);
    }

    function updateDoors() {
      const pad = SETTINGS.doorSensorPadding;

      const sensor = {
        x: player.x - pad,
        y: player.y,
        w: player.w + pad * 2,
        h: player.h
      };

      for (const door of doors) {
        if (!door.open && keyCount > 0 && intersects(sensor, door)) {
          door.open = true;
          keyCount -= 1;
        }
      }
    }

    function checkSpikes() {
      for (const spike of spikes) {
        if (intersects(player, spike)) {
          resetPlayer();
          return true;
        }
      }

      return false;
    }

    function updateEnemy(enemy) {
      if (enemy.dead) return;

      enemy.vy += SETTINGS.gravity;

      if (!enemy.shooter) {
        let hitWall = false;
        const moveDir = enemy.dir;

        enemy.x += enemy.dir * enemy.speed;

        forSolidRects(s => {
          if (intersects(enemy, s)) {
            if (moveDir > 0) {
              enemy.x = s.x - enemy.w;
            } else if (moveDir < 0) {
              enemy.x = s.x + s.w;
            }

            if (!hitWall) {
              enemy.dir *= -1;
              hitWall = true;
            }
          }
        });

        enemy.y += enemy.vy;
        enemy.onGround = false;

        forSolidRects(s => {
          if (intersects(enemy, s)) {
            if (enemy.vy > 0) {
              enemy.y = s.y - enemy.h;
              enemy.vy = 0;
              enemy.onGround = true;
            } else if (enemy.vy < 0) {
              enemy.y = s.y + s.h;
              enemy.vy = 0;
            }
          }
        });

        if (!hitWall && enemy.onGround) {
          const frontX = enemy.dir > 0 ? enemy.x + enemy.w + 4 : enemy.x - 4;
          const footY = enemy.y + enemy.h + 4;

          if (!solidAt(frontX, footY)) {
            enemy.dir *= -1;
          }
        }
      } else {
        enemy.dir =
          player.x + player.w / 2 > enemy.x + enemy.w / 2
            ? 1
            : -1;

        enemy.y += enemy.vy;
        enemy.onGround = false;

        forSolidRects(s => {
          if (intersects(enemy, s)) {
            if (enemy.vy > 0) {
              enemy.y = s.y - enemy.h;
              enemy.vy = 0;
              enemy.onGround = true;
            } else if (enemy.vy < 0) {
              enemy.y = s.y + s.h;
              enemy.vy = 0;
            }
          }
        });

        if (enemy.shootCooldown > 0) {
          enemy.shootCooldown -= 1;
        }

        const dx = Math.abs(
          player.x + player.w / 2 - (enemy.x + enemy.w / 2)
        );

        const dy = Math.abs(
          player.y + player.h / 2 - (enemy.y + enemy.h / 2)
        );

        if (
          dx < SETTINGS.shooterRangeX &&
          dy < SETTINGS.shooterRangeY &&
          enemy.shootCooldown <= 0
        ) {
          bullets.push({
            x: enemy.x + enemy.w / 2 + enemy.dir * (enemy.w / 2 + 4),
            y: enemy.y + enemy.h / 2 - 4,
            w: SETTINGS.bulletWidth,
            h: SETTINGS.bulletHeight,
            vx: enemy.dir * SETTINGS.bulletSpeed,
            dead: false
          });

          enemy.shootCooldown = SETTINGS.shooterCooldown;
        }
      }

      if (enemy.y > levelHeight + 300) {
        enemy.dead = true;
      }
    }

    function updateBullets() {
      for (const bullet of bullets) {
        bullet.x += bullet.vx;

        if (bullet.x < -200 || bullet.x > levelWidth + 200) {
          bullet.dead = true;
        }

        forSolidRects(s => {
          if (intersects(bullet, s)) {
            bullet.dead = true;
          }
        });

        if (!bullet.dead && intersects(bullet, player)) {
          resetPlayer();
          return true;
        }
      }

      bullets = bullets.filter(bullet => !bullet.dead);

      return false;
    }

    function updateGame() {
      if (gameFinished) {
        if (keys.Enter) {
          score = 0;
          gameFinished = false;
          loadLevel(0);
        }

        return;
      }

      if (levelComplete) {
        levelCompleteTimer -= 1;

        if (levelCompleteTimer <= 0) {
          if (currentLevelIndex + 1 < LEVELS.length) {
            loadLevel(currentLevelIndex + 1);
          } else {
            gameFinished = true;
          }
        }

        return;
      }

      updateMovingPlatforms();
      updatePlayer();
      updateCheckpoints();
      updateKeys();
      updateDoors();

      if (checkSpikes()) {
        return;
      }

      for (const enemy of enemies) {
        updateEnemy(enemy);

        if (!enemy.dead && intersects(player, enemy)) {
          if (player.vy > 0 && player.y + player.h - enemy.y < 26) {
            enemy.dead = true;
            player.vy = SETTINGS.stompBounce;
            player.jumpsLeft = 1;
            score += 5;
          } else {
            resetPlayer();
            return;
          }
        }
      }

      enemies = enemies.filter(enemy => !enemy.dead);

      if (updateBullets()) {
        return;
      }

      for (const coin of coins) {
        if (!coin.taken && intersects(player, coin)) {
          coin.taken = true;
          score += 1;
        }
      }

      coins = coins.filter(coin => !coin.taken);

      // Уровень пройден, если собраны все монеты
      if (!levelComplete && coins.length === 0) {
        levelComplete = true;
        levelCompleteTimer = SETTINGS.levelTransitionDelay;
      }
    }

    // ============================================
    // ОТРИСОВКА
    // ============================================
    function drawSprite(name, fallbackColor, x, y, w, h) {
      const img = IMAGES[name];

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
      } else {
        ctx.fillStyle = fallbackColor;
        ctx.fillRect(x, y, w, h);
      }
    }

    function drawSky() {
      const img = IMAGES.sky;

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      } else {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#63b8ff");
        gradient.addColorStop(1, "#cfefff");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function drawClouds(camX, camY) {
      const wrapW = canvas.width + 600;

      for (const cloud of clouds) {
        let cx = cloud.x - camX * cloud.factor;

        cx = ((cx % wrapW) + wrapW) % wrapW - 300;

        const cy = cloud.y - camY * cloud.factor * 0.25;

        const img = IMAGES.cloud;

        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(
            img,
            cx,
            cy,
            160 * cloud.scale,
            80 * cloud.scale
          );
        } else {
          ctx.fillStyle = "rgba(255, 255, 255, 0.9)";

          ctx.beginPath();

          ctx.ellipse(
            cx,
            cy,
            45 * cloud.scale,
            24 * cloud.scale,
            0,
            0,
            Math.PI * 2
          );

          ctx.ellipse(
            cx + 35 * cloud.scale,
            cy + 6 * cloud.scale,
            34 * cloud.scale,
            20 * cloud.scale,
            0,
            0,
            Math.PI * 2
          );

          ctx.ellipse(
            cx - 35 * cloud.scale,
            cy + 8 * cloud.scale,
            30 * cloud.scale,
            18 * cloud.scale,
            0,
            0,
            Math.PI * 2
          );

          ctx.fill();
        }
      }
    }

    function drawSpike(spike) {
      const img = IMAGES.spike;

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, spike.x, spike.y, spike.w, spike.h);
      } else {
        ctx.fillStyle = "#c0392b";

        ctx.beginPath();
        ctx.moveTo(spike.x + 4, spike.y + spike.h - 4);
        ctx.lineTo(spike.x + spike.w / 2, spike.y + 6);
        ctx.lineTo(spike.x + spike.w - 4, spike.y + spike.h - 4);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawCheckpoint(checkpoint) {
      const img = IMAGES.checkpoint;

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(
          img,
          checkpoint.x,
          checkpoint.y,
          checkpoint.w,
          checkpoint.h
        );

        if (checkpoint.active) {
          ctx.strokeStyle = "#2ecc71";
          ctx.lineWidth = 3;
          ctx.strokeRect(
            checkpoint.x + 2,
            checkpoint.y + 2,
            checkpoint.w - 4,
            checkpoint.h - 4
          );
        }
      } else {
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(
          checkpoint.x + 20,
          checkpoint.y + 6,
          6,
          checkpoint.h - 12
        );

        ctx.fillStyle = checkpoint.active ? "#2ecc71" : "#bdc3c7";
        ctx.fillRect(
          checkpoint.x + 26,
          checkpoint.y + 10,
          16,
          12
        );
      }
    }

    function drawKey(key) {
      const img = IMAGES.key;

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, key.x, key.y, key.w, key.h);
      } else {
        ctx.fillStyle = "#f1c40f";

        ctx.fillRect(
          key.x,
          key.y + key.h * 0.35,
          key.w,
          key.h * 0.3
        );

        ctx.fillRect(
          key.x + key.w * 0.45,
          key.y,
          key.w * 0.15,
          key.h
        );
      }
    }

    function drawDoor(door) {
      if (door.open) {
        ctx.globalAlpha = 0.3;
      }

      drawSprite("door", "#8b5a2b", door.x, door.y, door.w, door.h);

      ctx.globalAlpha = 1;

      if (!door.open) {
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(
          door.x + door.w / 2 - 3,
          door.y + door.h / 2 - 4,
          6,
          12
        );
      }
    }

    function drawBullet(bullet) {
      const img = IMAGES.bullet;

      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, bullet.x, bullet.y, bullet.w, bullet.h);
      } else {
        ctx.fillStyle = "#e74c3c";

        ctx.beginPath();
        ctx.arc(
          bullet.x + bullet.w / 2,
          bullet.y + bullet.h / 2,
          bullet.w / 2,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    function drawEnemy(enemy) {
      if (enemy.dead) return;

      drawSprite(
        "enemy",
        enemy.shooter ? "#e67e22" : "#d94f4f",
        enemy.x,
        enemy.y,
        enemy.w,
        enemy.h
      );

      if (enemy.shooter) {
        ctx.fillStyle = "#333";

        if (enemy.dir > 0) {
          ctx.fillRect(
            enemy.x + enemy.w - 6,
            enemy.y + enemy.h / 2 - 3,
            14,
            6
          );
        } else {
          ctx.fillRect(
            enemy.x - 8,
            enemy.y + enemy.h / 2 - 3,
            14,
            6
          );
        }
      }
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawSky();

      const camX = clamp(
        player.x + player.w / 2 - canvas.width / 2,
        0,
        Math.max(0, levelWidth - canvas.width)
      );

      const camY = clamp(
        player.y + player.h / 2 - canvas.height / 2,
        0,
        Math.max(0, levelHeight - canvas.height)
      );

      drawClouds(camX, camY);

      ctx.save();
      ctx.translate(-Math.round(camX), -Math.round(camY));

      for (const s of solids) {
        drawSprite("ground", "#7a4f2a", s.x, s.y, s.w, s.h);
      }

      for (const platform of movingPlatforms) {
        drawSprite("moving", "#8e44ad", platform.x, platform.y, platform.w, platform.h);
      }

      for (const door of doors) {
        drawDoor(door);
      }

      for (const checkpoint of checkpoints) {
        drawCheckpoint(checkpoint);
      }

      for (const key of keyItems) {
        drawKey(key);
      }

      for (const spike of spikes) {
        drawSpike(spike);
      }

      for (const coin of coins) {
        const bob =
          Math.sin(Date.now() / SETTINGS.coinBobSpeed + coin.x) *
          SETTINGS.coinBobAmount;

        drawSprite("coin", "#ffd23d", coin.x, coin.y + bob, coin.w, coin.h);
      }

      for (const enemy of enemies) {
        drawEnemy(enemy);
      }

      for (const bullet of bullets) {
        drawBullet(bullet);
      }

      drawSprite("player", "#3aa6ff", player.x, player.y, player.w, player.h);

      ctx.restore();

      // HUD
      ctx.fillStyle = "#000";
      ctx.font = "22px Arial";
      ctx.textAlign = "left";

      ctx.fillText(`Уровень: ${currentLevelIndex + 1}/${LEVELS.length}`, 16, 32);
      ctx.fillText(`Очки: ${score}`, 16, 60);
      ctx.fillText(`Ключи: ${keyCount}`, 16, 88);

      if (levelComplete) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "36px Arial";
        ctx.fillText("Уровень пройден!", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "22px Arial";

        const nextText =
          currentLevelIndex + 1 < LEVELS.length
            ? "Переход на следующий уровень..."
            : "Завершение игры...";

        ctx.fillText(nextText, canvas.width / 2, canvas.height / 2 + 25);
      }

      if (gameFinished) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "42px Arial";
        ctx.fillText("Игра пройдена!", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "24px Arial";
        ctx.fillText(`Итоговые очки: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.fillText("Нажми Enter, чтобы начать заново", canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    loadLevel(0);

    function gameLoop() {
      updateGame();
      drawGame();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
