<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-платформер</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: min(calc(100vw - 8px), calc((100vh - 8px) * 16 / 9));
      height: auto;
      border: 4px solid #000;
      image-rendering: pixelated;
      background: #63b8ff;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <!-- Игра: модули собирает Vite -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
