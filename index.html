<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-платформер</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: min(calc(100vw - 8px), calc((100vh - 8px) * 16 / 9));
      height: auto;
      border: 4px solid #000;
      image-rendering: pixelated;
      background: #63b8ff;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <!-- Настройки игры -->
  <script src="settings.js"></script>

  <!-- Уровни -->
  <script src="levels/level1.js"></script>
  <script src="levels/level2.js"></script>
  <script src="levels/level3.js"></script>
  <script src="levels/level4.js"></script>
  <script src="levels/level5.js"></script>
  <script src="levels/level6.js"></script>
  <script src="levels/level7.js"></script>
  <script src="levels/level8.js"></script>
  <script src="levels/levels-list.js"></script>

  <!-- Движок игры: файлы подключаются по порядку, без сборки -->
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/input.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
