<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-платформер</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: min(calc(100vw - 8px), calc((100vh - 8px) * 16 / 9));
      max-height: calc(100vh - 8px);
      height: auto;
      border: 4px solid var(--border);
      image-rendering: pixelated;
      background: var(--bg);
      box-shadow: var(--elev-raised);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Кнопки для телефона и планшета */
    .touch-controls {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    body.touch.touch-game .touch-controls {
      display: flex;
    }

    .touch-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      border: 2px solid color-mix(in srgb, var(--surface) 60%, transparent);
      background: color-mix(in srgb, var(--fg) 55%, transparent);
      color: var(--surface);
      font-size: 24px;
      line-height: 1;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-btn.small {
      width: 52px;
      height: 52px;
      font-size: 16px;
    }

    .touch-btn:active {
      background: color-mix(in srgb, var(--accent) 80%, transparent);
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <div id="touchControls" class="touch-controls">
    <div class="touch-group">
      <button class="touch-btn" type="button" data-key="ArrowLeft" aria-label="Влево">◀</button>
      <button class="touch-btn" type="button" data-key="ArrowRight" aria-label="Вправо">▶</button>
    </div>
    <div class="touch-group">
      <button class="touch-btn small" type="button" data-action="pause" aria-label="Пауза">❚❚</button>
      <button class="touch-btn small" type="button" data-key="ArrowDown" aria-label="Вниз">▼</button>
      <button class="touch-btn" type="button" data-action="jump" aria-label="Прыжок">▲</button>
    </div>
  </div>

  <!-- Игра: модули собирает Vite -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
